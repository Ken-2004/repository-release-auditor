name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (reviewed commit)
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7 (reviewed commit)
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python 3.12 for package verification
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Verify package inspector Python on Windows
        if: runner.os == 'Windows'
        run: python -c "import sys; print(sys.version.split()[0]); sys.exit(0 if sys.version_info[:2] == (3, 12) else 1)"

      - name: Verify package inspector Python on Ubuntu
        if: runner.os == 'Linux'
        run: python3 -c "import sys; print(sys.version.split()[0]); sys.exit(0 if sys.version_info[:2] == (3, 12) else 1)"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Verify package and installed CLI
        timeout-minutes: 10
        run: npm run pack:verify

      - name: Test development build after packaging
        run: npm test

      - name: Audit dependencies
        run: npm audit

      - name: Build
        run: npm run build

      - name: Verify clean working tree
        run: >-
          node -e "const { execFileSync } = require('node:child_process');
          const status = execFileSync('git', ['status', '--porcelain', '--untracked-files=all'], { encoding: 'utf8' });
          if (status.length > 0) { process.stderr.write(status); process.exit(1); }"

      - name: Text self-audit
        run: node dist/src/cli.js .

      - name: JSON self-audit
        run: node dist/src/cli.js --format json .
