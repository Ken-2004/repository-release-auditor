name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node 24 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit

      - name: Build
        run: npm run build

      - name: Verify clean working tree
        run: >-
          node -e "const { execFileSync } = require('node:child_process');
          const status = execFileSync('git', ['status', '--porcelain', '--untracked-files=all'], { encoding: 'utf8' });
          if (status.length > 0) { process.stderr.write(status); process.exit(1); }"

      - name: Text self-audit
        run: node dist/src/cli.js .

      - name: JSON self-audit
        run: node dist/src/cli.js --format json .
